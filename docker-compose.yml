version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: luz-cv-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-luz_cv}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - luz-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: luz-cv-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      POSTGRES_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-luz_cv}
      JWT_SECRET: ${JWT_SECRET:-your-super-secure-jwt-secret-key-change-this}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-your-super-secure-refresh-token-secret-change-this}
      JWT_EXPIRE: ${JWT_EXPIRE:-24h}
      REFRESH_TOKEN_EXPIRE: ${REFRESH_TOKEN_EXPIRE:-7d}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CONTACT_EMAIL_TO: ${CONTACT_EMAIL_TO:-}
      CONTACT_EMAIL_FROM: ${CONTACT_EMAIL_FROM:-onboarding@resend.dev}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    networks:
      - luz-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  luz-network:
    driver: bridge

